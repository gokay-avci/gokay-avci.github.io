base_url = "https://gokay-avci.github.io"
title = "Avci Lab"
description = "Computational Materials Science Personal Website"
default_language = "en"
theme = "daisy"
build_search_index = true
generate_feeds = true

taxonomies = [
  { name = "tags", paginate_by = 10, feed = true },
  { name = "categories", paginate_by = 10, feed = true },
]

[markdown]
render_emoji = true

[markdown.highlighting]
error_on_missing_language = false
style = "inline"
theme = "github-dark"
# If you prefer light/dark highlighting instead of a single theme, use:
# light_theme = "github-light"
# dark_theme = "github-dark"

[search]
index_format = "elasticlunr_json"
include_title = true
include_content = true

[extra]
github = "gokay-avci"
twitter = "---"
email = "gavci@u.lab"

enable_theme_switching = false
theme_toggle = true
daisyui_theme_light = "Emerald"
daisyui_theme_dark = "Forest"

daisyui_themes = [
  "light", "dark", "cupcake", "bumblebee", "emerald", "corporate",
  "synthwave", "retro", "cyberpunk", "valentine", "halloween",
  "garden", "forest", "aqua", "lofi", "pastel", "fantasy",
  "wireframe", "black", "luxury", "dracula", "cmyk", "autumn",
  "business", "acid", "lemonade", "night", "coffee", "winter"
]

[extra.navbar]
links = [
  { url = "about", i18n_key = "nav_about" },
  { url = "projects", i18n_key = "nav_projects" },
  { url = "blog", i18n_key = "nav_journal" },
  { url = "CV", i18n_key = "nav_CV" },
]

[extra.footer]
notice = "• Built with :heart: by @Gokay Avci 2026 •"