<figure style="text-align:center; margin: 2rem 0; background: #1a1a1a; padding: 1rem; border-radius: 8px; border: 1px solid #333;">
    <img src="{{ src }}" style="max-width:100%; height:auto; background:white; padding:5px; border-radius:4px;" loading="lazy">
    {% if caption %}
    <figcaption style="margin-top:0.5rem; font-size:0.9rem; color:#aaa;"><strong>Fig.</strong> {{ caption }}</figcaption>
    {% endif %}
</figure>
