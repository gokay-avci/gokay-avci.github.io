{# Usage: {{ figure(src="/projects/porosity/porosity.jpg", caption="...", alt="...") }} #}

{% set alt = alt | default(value=caption | default(value="Figure")) %}

<figure class="not-prose my-8">
  <div class="rounded-box border border-base-300/60 bg-base-200/40 p-3">
    <img
      src="{{ src }}"
      alt="{{ alt }}"
      loading="lazy"
      decoding="async"
      class="w-full rounded-box"
    />
  </div>

  {% if caption %}
    <figcaption class="mt-2 text-sm opacity-70">
      <span class="font-semibold">Fig.</span> {{ caption }}
    </figcaption>
  {% endif %}
</figure>
