<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Grain Growth</title>

    <!-- Critical for GitHub Pages + nested hosting + iframes -->
    <base href="/demos/grains/" />

    <!-- Trunk entry -->
    
<script type="module">
import init, * as bindings from '/demos/grains/grains-3785a1b2a463a6d5.js';
const wasm = await init({ module_or_path: '/demos/grains/grains-3785a1b2a463a6d5_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    <style>
      :root {
        --panel-bg: rgba(12, 12, 14, 0.92);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.62);
        --btn-bg: rgba(255, 255, 255, 0.12);
        --btn-bg-hover: rgba(255, 255, 255, 0.18);
        --ring: rgba(255, 255, 255, 0.14);
      }

      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans",
          "Apple Color Emoji", "Segoe UI Emoji";
      }

      /* Canvas should be the only scrolling surface: none. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none; /* stops scroll/zoom gestures inside iframes */
      }

      /* UI panel (no blur to avoid scroll/composite hitches) */
      #ui {
        position: absolute;
        top: 14px;
        left: 14px;
        width: 260px;
        padding: 14px;
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        background: var(--panel-bg);
        color: var(--text);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      #ui h1 {
        margin: 0 0 10px 0;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #ui .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      #ui button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid var(--ring);
        background: var(--btn-bg);
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      #ui button:hover { background: var(--btn-bg-hover); }
      #ui button:active { transform: translateY(1px); }

      /* Lightweight loader that disappears when WASM signals readiness */
      #loader {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: rgba(0,0,0,0.18);
        color: rgba(255,255,255,0.86);
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.25);
        border-top-color: rgba(255,255,255,0.75);
        animation: spin 900ms linear infinite;
        margin-right: 10px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .loader-inline {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(12,12,14,0.72);
      }

      /* When ready, hide loader */
      html[data-wasm-ready="1"] #loader { display: none; }

      @media (max-width: 420px) {
        #ui { width: min(92vw, 300px); }
      }
    </style>

    <script>
      // Any WASM app can call: window.setWasmReady()
      window.setWasmReady = function () {
        document.documentElement.dataset.wasmReady = "1";
      };
      // Also allow event-based readiness:
      window.addEventListener("wasm:ready", () => window.setWasmReady());

      // Safety: if you forget to call it, hide loader after a while.
      // (Keeps UX sane without masking real problems too quickly.)
      setTimeout(() => window.setWasmReady(), 8000);
    </script>
  <link rel="modulepreload" href="/demos/grains/grains-3785a1b2a463a6d5.js" crossorigin="anonymous" integrity="sha384-aMarKKtIBPwPB2y26F/0pQKYkF77QFe5B/e+yp5Nifovo53fARWAxO2GwudcxzQl"><link rel="preload" href="/demos/grains/grains-3785a1b2a463a6d5_bg.wasm" crossorigin="anonymous" integrity="sha384-kVi4aMg81ictlfgTAIEQ+YgdlGK+D2sGYgaS+3GIDkrnGNsi5QROSZ+mMNL0985l" as="fetch" type="application/wasm"></head>

  <body>
    <canvas id="canvas" aria-label="Grain growth simulation canvas"></canvas>

    <div id="ui" role="group" aria-label="Grain growth controls">
      <h1>Microstructure</h1>
      <button id="reset" type="button">Quench (Reset)</button>
    </div>

    <div id="loader" aria-live="polite">
      <div class="loader-inline">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading simulation…</span>
      </div>
    </div>
  </body>
</html>
