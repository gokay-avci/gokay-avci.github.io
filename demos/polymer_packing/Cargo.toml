[workspace]
members = [
    "crates/evokups-core",
    "crates/evokups-evaluators",
    "crates/evokups-polymer",
    "crates/evokups-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/gokay-avci/evokUPS"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
cast_precision_loss = "allow"
