[package]
name = "grains"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
rand_chacha = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "MouseEvent", "Event", "ImageData", "DomRect"] }