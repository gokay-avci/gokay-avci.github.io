# ==================================================================================
# THE FINAL, ULTIMATE, & SIMPLIFIED DEPLOYMENT WORKFLOW
# ==================================================================================
# This is the fully corrected, production-ready workflow. It reliably builds
# the WASM demos and Zola site without the extra complexity of optimization steps.
# ==================================================================================

name: Build and Deploy Website

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STAGE 1: SETUP RUST & BUILD WASM DEMOS
      # ------------------------------------------------------------------

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 Target
        # Installs the specific compiler target required for WebAssembly.
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        # This critical optimization makes builds after the first one much faster.
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        # Installs the `trunk` tool needed to build the WASM demos.
        run: cargo install --locked trunk

      - name: Build WASM Demos
        # This loop finds every subdirectory in `/demos` and builds it.
        run: |
          for D_PATH in demos/*; do
            if [ -d "$D_PATH" ]; then
              # Use a subshell to safely change directories for each build.
              (
                echo "--- Building WASM Demo in $D_PATH ---"
                cd "$D_PATH"
                trunk build --release
              )
            fi
          done

      # ------------------------------------------------------------------
      # STAGE 2: BUILD THE ZOLA WEBSITE
      # ------------------------------------------------------------------

      - name: Install Zola
        uses: taiki-e/install-action@zola

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Website with Zola
        # Builds the site using the correct base URL for your User Page.
        run: zola build --base-url https://gokay-avci.github.io/

      - name: Upload Artifact
        # Packages the final website from the '/public' directory.
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        # Publishes the packaged website to your live URL.
        uses: actions/deploy-pages@v4
