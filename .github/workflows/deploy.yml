# ==================================================================================
# THE ABSOLUTE, FINAL, ULTIMATE & ROBUST DEPLOYMENT WORKFLOW
# ==================================================================================
# This is the fully corrected, production-ready workflow. It handles all
# dependencies, including the specific Rust WASM target, for a complete and
# successful build and deployment.
# ==================================================================================

name: Build and Deploy Website

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STAGE 1: SETUP RUST & BUILD WASM DEMOS
      # ------------------------------------------------------------------

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 Target
        # THIS IS THE CRITICAL FIX:
        # Installs the specific compiler target required for WebAssembly.
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: cargo install --locked trunk

      - name: Install WASM Optimizer
        run: cargo install wasm-bindgen-cli

      - name: Build AND Optimize WASM Demos
        run: |
          for D_PATH in demos/*; do
            if [ -d "$D_PATH" ]; then
              (
                echo "--- Building WASM Demo in $D_PATH ---"
                cd "$D_PATH"
                trunk build --release
              )
              echo "--- Optimizing WASM output for $D_PATH ---"
              wasm-opt -Oz -o "static/demos/${D_PATH##*/}/"*.wasm "static/demos/${D_PATH##*/}/"*.wasm
            fi
          done

      # ------------------------------------------------------------------
      # STAGE 2: BUILD THE ZOLA WEBSITE
      # ------------------------------------------------------------------

      - name: Install Zola
        uses: taiki-e/install-action@zola

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Website with Zola
        run: zola build --base-url https://gokay-avci.github.io/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
