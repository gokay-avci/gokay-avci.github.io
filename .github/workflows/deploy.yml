# ==================================================================================
# THE ULTIMATE DEPLOYMENT WORKFLOW WITH INTELLIGENT WASM CACHING
# ==================================================================================
# This advanced workflow caches not only the Rust dependencies but also the
# final compiled WASM output. The WASM build step is SKIPPED ENTIRELY if the
# Rust source code in the `/demos` directory has not changed.
# ==================================================================================

name: Build and Deploy Website

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STAGE 1: SETUP RUST & BUILD/RESTORE WASM DEMOS
      # ------------------------------------------------------------------

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 Target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      # --- NEW: Intelligent WASM Output Cache ---
      - name: Generate Cache Key for Demos
        # Create a unique 'fingerprint' based on the contents of all files
        # in the demos directory. If any .rs or Cargo.toml file changes,
        # this hash will change, invalidating the cache.
        id: cache-demos-key
        run: echo "hash=$(find demos -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache Compiled WASM Demos
        # Use the generated hash as the key for our cache.
        id: cache-demos-restore
        uses: actions/cache@v4
        with:
          path: static/demos
          key: ${{ runner.os }}-wasm-demos-${{ steps.cache-demos-key.outputs.hash }}

      - name: Install Trunk
        # This step only runs if we didn't find a valid WASM cache.
        if: steps.cache-demos-restore.outputs.cache-hit != 'true'
        run: cargo install --locked trunk

      - name: Build WASM Demos
        # This ENTIRE build step is now conditional. It will be SKIPPED
        # if the cache was successfully restored, saving significant time.
        if: steps.cache-demos-restore.outputs.cache-hit != 'true'
        run: |
          echo "WASM cache not found or invalid. Rebuilding demos..."
          for D_PATH in demos/*; do
            if [ -d "$D_PATH" ]; then
              (
                echo "--- Building WASM Demo in $D_PATH ---"
                cd "$D_PATH"
                trunk build --release
              )
            fi
          done

      # ------------------------------------------------------------------
      # STAGE 2: BUILD THE ZOLA WEBSITE
      # ------------------------------------------------------------------

      - name: Install Zola
        uses: taiki-e/install-action@zola

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Website with Zola
        run: zola build --base-url https://gokay-avci.github.io/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
