# ==================================================================================
# THE ULTIMATE DEPLOYMENT WORKFLOW (WITH RUST/WASM SUPPORT)
# ==================================================================================
# This workflow builds and deploys a Zola site that includes interactive
# demos compiled from Rust to WebAssembly using Trunk.
# ==================================================================================

name: Build and Deploy Zola Website with WASM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STAGE 1: BUILD THE WASM DEMOS
      # ------------------------------------------------------------------

      - name: Install Rust Toolchain
        # Sets up the entire Rust compiler environment (rustc, cargo).
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        # This is a critical optimization. It saves the downloaded Rust
        # libraries (crates) between runs. The first build will be slow,
        # but subsequent builds will be much faster.
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        # Installs the `trunk` tool, which is the best way to build
        # WASM apps that need to interact with the web.
        run: cargo install --locked trunk

      - name: Build WASM Demos with Trunk
        # This step runs the `trunk build` command inside each demo folder.
        # It will read the `Trunk.toml` file in each and place the
        # compiled output into your `static/demos/` directory.
        run: |
          for D in demos/*; do
            if [ -d "$D" ]; then
              echo "Building WASM Demo in $D..."
              trunk build --release "$D"
            fi
          done

      # ------------------------------------------------------------------
      # STAGE 2: BUILD THE ZOLA WEBSITE
      # ------------------------------------------------------------------

      - name: Install Zola
        uses: taiki-e/install-action@zola

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Website with Zola
        # Now that the demos are built and sitting in the /static folder,
        # Zola will automatically package them with the rest of the site.
        run: zola build --base-url https://gokay-avci.github.io/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
