# ==================================================================================
# THE ULTIMATE DEPLOYMENT WORKFLOW
# FOR A ZOLA WEBSITE WITH RUST/WASM DEMOS ON GITHUB PAGES
# ==================================================================================
# This workflow is the final, corrected version. It automatically:
#
# 1. Checks out your source code.
# 2. Installs the Rust toolchain and the Trunk WASM builder.
# 3. Caches Rust dependencies for incredibly fast subsequent builds.
# 4. Compiles each of your WASM demos in optimized release mode.
# 5. Shrinks the compiled WASM files for faster site loading.
# 6. Installs Zola.
# 7. Builds your Zola site using the correct, simple `base_url` for a User Page.
# 8. Deploys the final website to GitHub Pages.
# ==================================================================================

name: Build and Deploy Zola Website with WASM

on:
  # Run this workflow automatically on any push to the "main" branch
  push:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Grant the necessary permissions for the workflow to deploy.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    # Specify the deployment environment, which is required for GitHub Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Displays the live URL after a successful run

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STAGE 1: BUILD THE WASM DEMOS
      # ------------------------------------------------------------------

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        # This is a critical optimization. It saves downloaded libraries
        # and build artifacts, making builds after the first one much faster.
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        # Installs the `trunk` tool for building WASM web apps.
        run: cargo install --locked trunk

      - name: Install WASM Optimizer
        # Installs `wasm-opt` for shrinking WASM file size.
        run: cargo install wasm-bindgen-cli

      - name: Build AND Optimize WASM Demos
        # This loop finds every subdirectory in `/demos` and builds it.
        run: |
          for D in demos/*; do
            if [ -d "$D" ]; then
              echo "Building WASM Demo in $D..."
              # THIS IS THE CORRECTED COMMAND:
              # The project path is the main argument, --release is a modifying flag.
              trunk build "$D" --release
              
              echo "Optimizing WASM output for $D..."
              # This command finds the WASM file Trunk just built and shrinks it.
              # The `-Oz` flag optimizes aggressively for size.
              wasm-opt -Oz -o "static/demos/${D##*/}/"*.wasm "static/demos/${D##*/}/"*.wasm
            fi
          done

      # ------------------------------------------------------------------
      # STAGE 2: BUILD THE ZOLA WEBSITE
      # ------------------------------------------------------------------

      - name: Install Zola
        uses: taiki-e/install-action@zola

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Website with Zola
        # This builds the site using the simple and correct base URL for your
        # User Page repository (gokay-avci.github.io).
        run: zola build --base-url https://gokay-avci.github.io/

      - name: Upload Artifact
        # Packages the final website from the '/public' directory.
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        # Publishes the packaged website to your live URL.
        uses: actions/deploy-pages@v4
